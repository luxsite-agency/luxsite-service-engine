      secret_ready: Client Secret задано.
      secret_missing: Client Secret не задано.
      secret_no_key: 'На сервері нема ключа шифрування SETTINGS_SECRET_KEY (%problem%) — Client Secret зберегти не можна. Зверніться до розробника.'
      secret_unreadable: 'Збережений Client Secret не розшифрувати: ключ шифрування на сервері змінено — введіть секрет знову.'
      enabled_settings: Увімкнено, працюють ключі з налаштувань сайту.
      enabled_env: 'Перемикач вимкнено: працюють ключі зі змінних сервера (.env.local). Увімкніть, щоб діяли ключі з налаштувань.'
      enabled_incomplete: Перемикач увімкнено, але ключі неповні — кнопки на сайті нема.
      enabled_off: Перемикач вимкнено, ключів на сервері теж нема — кнопки на сайті нема.
      hosts: 'Адрес для Google Cloud Console: %count% (по одній на активне місто) — усі мають бути в OAuth-клієнті.'
      hosts_none: Активних міст нема — redirect URI немає куди вести.
      google_ok: 'Google відповідає: issuer %issuer%, ключів підпису %keys%.'
      google_endpoints_changed: Google оголошує інші адреси кінцевих точок, ніж використовує рушій, — повідомте розробника.
      google_failed: 'Google недоступний з сервера (%reason%). Перевірте доступ сервера в інтернет і спробуйте пізніше.'
