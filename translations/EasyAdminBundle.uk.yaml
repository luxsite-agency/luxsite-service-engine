# Правки поверх українського перекладу EasyAdmin: у бандлі лишились
# неперекладені рядки й кальки з російської.

# «Null» нічого не каже тому, хто не програміст
label.null: не задано

# «Створити Послуга» - бандл підставляє назву в називному відмінку, і з
# жіночим чи середнім родом виходить безглуздо. Прибираємо назву зовсім:
# людина і так бачить, у якому вона розділі.
action.new: Додати
page_title.new: 'Створення: %entity_label_singular%'

# «Відмінити» - русизм
action.cancel: Скасувати

# «випадаюче меню» - калька, українською меню спадне
action.toggle_dropdown: Розгорнути меню

# «Пусто» в порожньому випадному списку - теж русизм
label.form.empty_value: Не обрано
label.empty: Порожньо
