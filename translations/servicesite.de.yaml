legal.privacy_html: |
    <p>%site% betreibt %domain%. Diese Datenschutzerklärung erläutert, wie wir mit den Daten der Besucher auf unserer Website umgehen.</p>
    <h2>Daten, die wir erheben</h2>
    <p>Wir erhalten nur personenbezogene Daten, die Sie uns freiwillig über unser <a href="%contact%">Kontaktformular</a> übermitteln. Dazu gehören:</p>
    <ul>
    <li>Ihr Name</li>
    <li>Ihre E-Mail-Adresse</li>
    <li>Ihr Nachrichtentext</li>
    </ul>
    <p>Wir verwenden diese Informationen ausschließlich zur Beantwortung Ihrer Anfrage. Wir verkaufen oder vermieten Ihre personenbezogenen Daten nicht; sie werden nur von den Diensten verarbeitet, die für den Betrieb der Website erforderlich sind (Hosting, E-Mail-Zustellung).</p>
    <h2>Technische Daten und Cookies</h2>
    <p>Der Server der Website erhebt automatisch grundlegende technische Daten wie IP-Adressen und Browser-Logs, um einen sicheren Betrieb zu gewährleisten. Wenn Webanalysen aktiviert sind (z. B. Google Analytics), werden Cookies gesetzt, um die Nutzung der Website besser zu verstehen. Sie können Ihre Einstellungen über unser Cookie-Banner verwalten.</p>
    <h2>Speicherung und Rechte</h2>
    <p>Wir speichern über das Formular gesendete Nachrichten bis zu 12 Monate. Sie haben das Recht, Auskunft über Ihre personenbezogenen Daten zu verlangen, Korrekturen oder die Löschung zu beantragen. Um diese Rechte auszuüben, schreiben Sie uns über das <a href="%contact%">Kontaktformular</a>.</p>
    <h2>Änderungen</h2>
    <p>Wir können diese Datenschutzerklärung gelegentlich aktualisieren. Überarbeitungen werden direkt auf dieser Seite veröffentlicht.</p>
legal.terms_html: |
    <p>Willkommen auf %domain%. Durch den Zugriff auf unsere Website und das Lesen der Inhalte erklären Sie sich mit den folgenden Bedingungen einverstanden.</p>
    <h2>Informationsgehalte</h2>
    <p>Alle auf %domain% veröffentlichten Artikel, Ratgeber und Materialien dienen ausschließlich allgemeinen Informationszwecken. Sie stellen keine professionelle Beratung dar. Sie sollten sich nicht ohne unabhängigen Fachrat auf diese Inhalte verlassen.</p>
    <h2>Genauigkeit und Garantien</h2>
    <p>%site% ist bemüht, alle Informationen aktuell und korrekt zu halten. Wir übernehmen jedoch keine ausdrückliche oder stillschweigende Garantie hinsichtlich der Vollständigkeit, Zuverlässigkeit oder Verfügbarkeit der Website-Inhalte.</p>
    <h2>Externe Links</h2>
    <p>Unsere Website kann Links zu externen Webressourcen enthalten. %site% kontrolliert oder unterstützt diese Websites Dritter nicht und übernimmt keine Verantwortung für deren Inhalte oder Datenschutzpraktiken.</p>
    <h2>Urheberrecht</h2>
    <p>Sofern nicht anders angegeben, gehören alle Text- und Bildinhalte auf %domain% zu %site%. Sie dürfen kurze Auszüge aus unseren Artikeln zitieren, vorausgesetzt, Sie fügen einen aktiven Link zur Originalseite auf %domain% ein.</p>
    <h2>Kontakt</h2>
    <p>Wenn Sie Fragen zu diesen Bedingungen haben, senden Sie uns bitte eine Nachricht über das <a href="%contact%">Kontaktformular</a>.</p>

