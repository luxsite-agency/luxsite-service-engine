# Рушій сервісних сайтів: у dev бренд = <site>.localhost, місто бренду =
# <city>.<site>.localhost (example.localhost, north.example.localhost:8113);
# адмінка — service-sites.localhost. У прод — реальні домени по Host.
server {
    listen 80;
    server_name service-sites.localhost *.localhost;
    root /app/public;

    client_max_body_size 32m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass service-engine-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # сканери WordPress/phpMyAdmin — 404 на nginx, без PHP (тисячі запитів на день); решта *.php (старі /page.php сайтів,
    # що переїхали з PHP-CMS) — у фронт-контролер, щоб спрацювало правило редиректу бренду; файли не виконуються. 404 рушія на
    # *.php у журнал 404 не пише (NotFoundLog відсікає зонди) — правило заводиться вручну або з GSC (25.10.2026)
    location ~ (?:^/wp-|/wp-(?:login|admin|includes|content)|xmlrpc\.php|/phpmyadmin|/\.env|/vendor/phpunit) {
        return 404;
    }
    location ~ \.php$ {
        rewrite ^ /index.php last;
    }
}
