# Рушій сервісних сайтів: у dev бренд = <site>.localhost, місто бренду =
# <city>.<site>.localhost (example.localhost, north.example.localhost:8113);
# адмінка — service-sites.localhost. У прод — реальні домени по Host.
server {
    listen 80;
    server_name service-sites.localhost *.localhost;
    root /app/public;

    client_max_body_size 32m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass service-engine-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
