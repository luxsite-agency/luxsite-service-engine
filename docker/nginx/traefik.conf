# nginx стенда в Docker за traefik: TLS і Host вище (traefik), fastcgi → сервіс php того ж compose-проєкту.
# Один конфіг на всі сайти стенда: Host не фільтруємо (це робить traefik за мітками), резолв тенанта — у Symfony.
server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 32m;

    # gzip текстових відповідей (26.11.2026): traefik стенда не стискає, і HTML з інлайн-CSS теми (десятки КБ) ішов як є —
    # Lighthouse/PSI на стендах занижені. text/html стискається завжди (у gzip_types його не вказують); картинки й шрифти
    # woff2 вже стиснуті. gzip_proxied any — запит приходить через traefik. Прод (FastPanel, edge за Cloudflare) стискає сам.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/ld+json
               application/xml application/rss+xml application/manifest+json image/svg+xml;

    location ^~ /media/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # нема файлу → PHP: Liip /media/cache/resolve/<фільтр>/… генерує кеш і редіректить (на проді FastPanel так само через try_files)
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /img/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
