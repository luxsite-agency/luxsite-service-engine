# nginx стенда в Docker за traefik: TLS і Host вище (traefik), fastcgi → сервіс php того ж compose-проєкту.
# Один конфіг на всі сайти стенда: Host не фільтруємо (це робить traefik за мітками), резолв тенанта — у Symfony.
server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 32m;

    location ^~ /media/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # нема файлу → PHP: Liip /media/cache/resolve/<фільтр>/… генерує кеш і редіректить (на проді FastPanel так само через try_files)
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /img/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        internal;
    }

    # сканери WordPress/phpMyAdmin — 404 на nginx, без PHP (тисячі запитів на день); решта *.php (старі /page.php сайтів,
    # що переїхали з PHP-CMS) — у фронт-контролер, щоб спрацювало правило редиректу бренду; файли не виконуються. 404 рушія на
    # *.php у журнал 404 не пише (NotFoundLog відсікає зонди) — правило заводиться вручну або з GSC (25.10.2026)
    location ~ (?:^/wp-|/wp-(?:login|admin|includes|content)|xmlrpc\.php|/phpmyadmin|/\.env|/vendor/phpunit) {
        return 404;
    }
    location ~ \.php$ {
        rewrite ^ /index.php last;
    }
}
