# nginx проду в Docker за зовнішнім nginx (docker-compose.edge.yml): TLS, realip Cloudflare і X-Forwarded-* — у edge;
# fastcgi → сервіс php того ж compose-проєкту. Host не фільтруємо (це робить edge), тенант визначає Symfony за Host.
server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 32m;

    location ^~ /media/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # нема файлу → PHP: Liip /media/cache/resolve/<фільтр>/… генерує кеш і редіректить (на проді FastPanel так само через try_files)
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /img/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
