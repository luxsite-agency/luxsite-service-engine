; Прод у Docker за edge (Dockerfile.edge): як prod.ini, плюс TZ платформи.
memory_limit = 256M
; Фото через адмінку й admin API (…/image): до 10 МБ файл (Assert\Image сутностей), multipart/JSON з base64 — до 16 МБ
upload_max_filesize = 10M
post_max_size = 16M
expose_php = Off
display_errors = Off
log_errors = On

; Єдина TZ платформи — та сама, що на 161 (інакше дати Schema.org і заявок зсунуться в UTC).
date.timezone = Europe/Kyiv

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; код міняє лише bin/site deploy, а він перестворює контейнер php (новий реліз = інший ./ → /app)
opcache.validate_timestamps = 0

realpath_cache_size = 4M
realpath_cache_ttl = 600
