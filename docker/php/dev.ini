display_errors = On
error_reporting = E_ALL
memory_limit = 512M

; Єдина TZ платформи: весь застосунок і БД оперують київським часом.
; ТА САМА настройка обов'язкова на проді (інакше Schema.org дати зсунуться в UTC).
date.timezone = Europe/Kyiv

; Windows bind-mount повільний (9p): не перечитувати диск на кожен запит.
; Правки .php підхоплюються через local/refresh.sh (рестарт php-контейнера).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256

xdebug.mode = debug,develop
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
