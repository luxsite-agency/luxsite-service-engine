; Стенд у Docker за traefik: як прод (display_errors off, помилки в var/log), але opcache перечитує файли.
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 512M

; Єдина TZ платформи — та сама, що на проді (інакше Schema.org дати зсунуться в UTC).
date.timezone = Europe/Kyiv

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
