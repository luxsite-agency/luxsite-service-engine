# Пак сайту service-engine (формат 1, docs/site-pack.md рушія). Сервер, статус, бекапи — у реєстрі sites.yaml рушія.
# СЕКРЕТІВ ТУТ НЕМА: .env.local, паролі, токени — лише на сервері сайту.
format: 1
key: sitetemplate
name: 'Site Template'
locales: [uk, ru]
domains:
    site: sitetemplate.example.com
    admin: admin.sitetemplate.example.com
# Версія рушія, з якою пак перевірено (тег vX.Y.Z; до перших тегів — sha коміту main)
engine: main
