# Прод service-engine у Docker за зовнішнім nginx (рантайм `docker` + `proxy: edge` у sites.yaml).
# Запускає bin/site deploy з теки релізу (<root>/releases/<tag>, ./ → /app): SITE=<key>, SITE_ROOT=<root>, проєкт
# compose service-<key>. Руками (діагностика): cd <root>/current && SITE=<key> SITE_ROOT=<root> \
#   docker compose -p service-<key> -f docker-compose.edge.yml ps|logs|exec php …
# TLS, Cloudflare realip і заголовки (X-Robots-Tag стейджа тощо) — у зовнішньому nginx (напр. /opt/edge/conf.d/*.conf,
# proxy_pass http://service-<key>-nginx:80 у docker-мережі edge). Портів назовні тут НЕМА — інакше конфлікт з edge.
# Сайтове — поза релізом, у $SITE_ROOT: shared/.env.local (600, www-data), shared/db.env (600: паролі MySQL, генерує
# перший deploy), shared/media, shared/log, db-init/ (дамп для першого підйому порожнього тому MySQL).
# vendor і var — іменовані томи проєкту (спільні між релізами; composer install і cache:clear робить deploy).
# Відмінності від docker-compose.traefik.yml (стенд): без mailpit і міток traefik, паролі MySQL не дефолтні, php — www-data
# (uid 33 = користувач сайту на хості, server.user: www-data), opcache без перечитування диска (код міняє лише deploy,
# а він перестворює контейнери), ліміти пам'яті.

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.edge
    image: service-engine-php:edge
    container_name: service-${SITE:?SITE=<ключ сайту>}-php
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - ./:/app
      - vendor:/app/vendor
      - var:/app/var
      - ${SITE_ROOT:?SITE_ROOT=<root сайту>}/shared/.env.local:/app/.env.local:ro
      - ${SITE_ROOT}/shared/media:/app/public/media
      - ${SITE_ROOT}/shared/log:/app/var/log
    environment:
      # не ${APP_ENV}: змінна оточення оператора не має перебивати APP_ENV=prod з .env.local
      APP_ENV: prod
      COMPOSER_HOME: /tmp/composer
    networks: [internal]
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: service-${SITE}-nginx
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./docker/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
      - ${SITE_ROOT}/shared/media:/app/public/media:ro
    networks: [internal, edge]
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: service-${SITE}-mysql
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - ${SITE_ROOT}/shared/db.env
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
      # перший підйом на порожньому томі: *.sql.gz з db-init (дамп сайту)
      - ${SITE_ROOT}/db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    # 127.0.0.1 (TCP), не localhost (сокет): поки entrypoint імпортує db-init, тимчасовий сервер слухає лише сокет —
    # healthy раніше часу пустив би міграції на напівзалитий дамп
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

networks:
  internal:
  edge:
    external: true

volumes:
  vendor:
  var:
  mysql-data:
