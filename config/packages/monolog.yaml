monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # журнал змін налаштувань сайту (адмінка → Налаштування): хто, коли, який ключ, без значень — var/log/security_audit.log
        - security_audit

when@dev:
    monolog:
        handlers:
            security_audit:
                type: stream
                path: "%kernel.logs_dir%/security_audit.log"
                level: info
                channels: [security_audit]
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            security_audit:
                type: stream
                path: "%kernel.logs_dir%/security_audit.log"
                level: info
                channels: [security_audit]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # окремий файл, не fingers_crossed: записи info мають лишитися й без помилки в тому ж запиті (var/log → shared/log)
            security_audit:
                type: stream
                path: "%kernel.logs_dir%/security_audit.log"
                level: info
                channels: [security_audit]
                formatter: monolog.formatter.json
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
