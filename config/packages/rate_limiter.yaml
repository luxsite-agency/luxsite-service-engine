# Ліміти за IP (реальний IP на проді — з CF-Connecting-IP через nginx realip).
framework:
    rate_limiter:
        # невдалі автентифікації API-токенів з однієї IP (ApiTokenAuthenticator); ліміт — app.admin_api_auth_rate_limit
        admin_api_auth_ip:
            policy: sliding_window
            limit: '%app.admin_api_auth_rate_limit%'
            interval: '1 minute'
        # PUT|POST …/image через admin API: завантажень на токен за хвилину (ImageService); ліміт — app.admin_api_image_rate_limit
        admin_api_image_token:
            policy: sliding_window
            limit: '%app.admin_api_image_rate_limit%'
            interval: '1 minute'
        # POST /lead і /calculator/lead — заявки сервісних сайтів: лімітер service_lead_ip будує App\ServiceSite\LeadRateLimit сам
        # (ліміт — параметр паку app.lead_spam.ip_per_hour, вкладений параметр сюди не підставити; storage — cache.rate_limiter;
        # свої адреси - у LEAD_RATE_LIMIT_ALLOWLIST)
        # POST /reviews/submit — подача відгуків (Google-юзери)
        service_review_ip:
            policy: sliding_window
            limit: 10
            interval: '60 minutes'
