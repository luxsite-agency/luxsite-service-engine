# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # symfony/lock стоїть заради замка живої теми (ThemeService, свій FlockStore у var/theme, config/services.yaml).
    # Загальний lock.factory не вмикаємо: інакше rate limiter-и заявок і API почали б брати flock у системному /tmp
    # (на FastPanel його може не бути в open_basedir) — поведінка як до 22.10.2026.
    lock: false

when@prod:
    framework:
        # За traefik (TLS терміновано вище): довіряємо безпосередньому проксі,
        # інакше canonical/hreflang/redirect_uri генеруються як http://
        trusted_proxies: 'REMOTE_ADDR'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
