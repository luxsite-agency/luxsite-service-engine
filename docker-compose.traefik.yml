# Стенд service-engine у Docker за traefik — рантайм `docker` + `proxy: traefik` (типовий) для bin/site.
# Запускає bin/site deploy з теки релізу (<root>/releases/<tag>, ./ → /app): SITE=<key>, SITE_ROOT=<root>,
# проєкт compose service-<key>. Руками (діагностика): cd <root>/current && SITE=<key> SITE_ROOT=<root> \
#   docker compose -p service-<key> -f docker-compose.traefik.yml ps|logs|exec php …
# Хости — з реєстру (bin/site передає їх у _remote.sh, той — сюди): SITE_HOST (апекс-місто), SITE_ADMIN (адмінка),
# SITE_MAIL_HOST (mailpit; типово <key>-mail.<домен апекса>); інші міста = <slug>-<SITE_HOST> (wildcard-серт
# traefik зазвичай лише одного рівня). Без ports: — адресу дає traefik у зовнішній мережі edge.
# php працює від SITE_UID:SITE_GID (типово — користувач, що робить deploy, і група теки сайту), щоб у спільній теці
# стенда не плодити root-файлів. Інший compose-файл — SITE_COMPOSE_FILE або server.compose у реєстрі.
# Сайтове — поза релізом, у $SITE_ROOT: shared/.env.local (APP_ENV=prod, без прод-токенів; перший deploy створює сам),
# shared/media, shared/log, db-init/ (дамп для першого підйому порожнього тому MySQL, напр. 10-site.sql.gz, і
# 90-stand-hosts.sql з docker/traefik/90-stand-hosts.sql.tpl — підміна прод-хостів на стендові).
# vendor і var — іменовані томи проєкту (спільні між релізами; composer install і cache:clear робить deploy).
# Паролі MySQL тут навмисно дефолтні (стенд без портів назовні); для проду в Docker — docker-compose.edge.yml.
# Порядок — docs/site-ops.md (розділ «Стенд у Docker за traefik»).

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.traefik
      args:
        UID: ${SITE_UID:-1000}
        GID: ${SITE_GID:-1000}
    image: service-engine-php:traefik-${SITE_UID:-1000}-${SITE_GID:-1000}
    container_name: service-${SITE:?SITE=<ключ сайту>}-php
    restart: unless-stopped
    volumes:
      - ./:/app
      - vendor:/app/vendor
      - var:/app/var
      - ${SITE_ROOT:?SITE_ROOT=<root сайту>}/shared/.env.local:/app/.env.local:ro
      - ${SITE_ROOT}/shared/media:/app/public/media
      - ${SITE_ROOT}/shared/log:/app/var/log
      - ${SITE_ROOT}/shared/theme:/app/var/theme
      - ${SITE_ROOT}/shared/theme/public:/app/public/theme-live
    environment:
      # не ${APP_ENV}: змінна оточення оператора (напр. APP_ENV=dev для іншого проєкту) не має перебивати
      # APP_ENV=prod з .env.local — стенд тихо працював би в dev (http:// у canonical, dev.log)
      APP_ENV: ${STAND_APP_ENV:-prod}
      DATABASE_URL: "mysql://engine:engine@mysql:3306/${SITE}?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
    networks: [internal]
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: service-${SITE}-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/traefik.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
      - ${SITE_ROOT}/shared/media:/app/public/media:ro
      - ${SITE_ROOT}/shared/theme/public:/app/public/theme-live:ro
    networks: [internal, edge]
    depends_on:
      - php
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.service-${SITE}.rule=Host(`${SITE_HOST:-${SITE}.localhost}`) || Host(`${SITE_ADMIN:-${SITE}-admin.localhost}`) || HostRegexp(`^[a-z0-9-]+-${SITE_HOST:-${SITE}.localhost}$$`)
      - traefik.http.services.service-${SITE}.loadbalancer.server.port=80

  mysql:
    image: mysql:8.0
    container_name: service-${SITE}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${SITE}
      MYSQL_USER: engine
      MYSQL_PASSWORD: engine
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
      # перший підйом на порожньому томі: 10-*.sql.gz → 90-stand-hosts.sql
      - ${SITE_ROOT}/db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  mailpit:
    image: axllent/mailpit:latest
    container_name: service-${SITE}-mailpit
    restart: unless-stopped
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.service-${SITE}-mail.rule=Host(`${SITE_MAIL_HOST:-${SITE}-mail.localhost}`)
      - traefik.http.services.service-${SITE}-mail.loadbalancer.server.port=8025

networks:
  internal:
  edge:
    external: true

volumes:
  vendor:
  var:
  mysql-data:
